<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ten Points in Circles</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #toolbar {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 10px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        #toolbar button {
            border: 1px solid #bbb;
            background: #fff;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        #toolbar button.active {
            background: #e7f0ff;
            border-color: #6ea0ff;
        }

        #toolbar .spacer {
            flex: 1;
        }

        #status {
            font-size: 14px;
            color: #444;
        }

        #canvas-wrap {
            padding: 10px;
            flex: 1;
            min-height: 0;
        }

        #scene {
            width: 100%;
            height: 100%;
            display: block;
            background: #fff;
            border: 1px solid #cfcfcf;
            border-radius: 8px;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="mode-select" class="active">Select/Move</button>
        <button id="mode-point">Add Point</button>
        <button id="mode-circle">Add Circle</button>
        <button id="delete-selected">Delete Selected</button>
        <button id="clear-selection">Clear Selection</button>
        <div class="spacer"></div>
        <div id="status">Points: <span id="point-count">0</span></div>
    </div>
    <div id="canvas-wrap">
        <canvas id="scene" width="900" height="900"></canvas>
    </div>
    <script src="bundle.js"></script>
</body>
</html>
